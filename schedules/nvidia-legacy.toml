# A template for the user's old NVIDIA cards: the Quadro K4200 (Kepler,
# 4 GB), the Tesla M10 (Maxwell, four GPUs, each an OpenCL device) and
# the Tesla P4 (Pascal), which the newest CUDA toolkits retire
# (docs/plan.md, the hardware table): work-groups of 1024, products in
# 16 by 16 tiles. Not yet run on any; adjust it there (a card that
# differs gets a file of its own) and set tested = true.
device = "NVIDIA Kepler, Maxwell and Pascal: Quadro K4200, Tesla M10, Tesla P4 (template)"
tested = false
float = "f32"
int = "i64"
work_group = 1024
tile = 16
