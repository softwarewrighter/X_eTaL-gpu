# A template for the user's old NVIDIA Teslas: the Tesla M10 (Maxwell,
# four GPUs, each an OpenCL device) and the Tesla P4 (Pascal), which the
# newest CUDA toolkits retire (docs/plan.md, the hardware table):
# work-groups of 1024, products in 16 by 16 tiles. Not yet run on
# either; adjust it there and set tested = true.
device = "NVIDIA Maxwell and Pascal Teslas: M10, P4 (template)"
tested = false
float = "f32"
int = "i64"
work_group = 1024
tile = 16
